# QA Test Hub Docker Compose
# Usage:
#   cp .env.example .env   # depois editar DB_PASSWORD
#   docker compose up --build -d
#   docker compose exec app npm run migrate   # first time only

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qa_framework}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY:  http://10.103.16.12:3128
        HTTPS_PROXY: http://10.103.16.12:3128
        NO_PROXY: "localhost,127.0.0.1,.meo.pt,.altice.pt,db,portal.uat.camara.prv.alpt.alticelabs.cloud"

    # Permite ao container contactar o host (necessario para o PAM Auth Proxy)
    extra_hosts:
      #- "host.docker.internal:host-gateway"
      - "10.131.65.136:host-gateway"

    environment:
      # DB config
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-qa_framework}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}

      # App runtime
      PORT: 3000
      NODE_ENV: production
      PLAYWRIGHT_HEADLESS: "true"
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-in-production}
      ENABLE_LOCAL_AUTH: ${ENABLE_LOCAL_AUTH:-true}

      # PAM Auth Proxy ACTIVADO
      ENABLE_PAM_AUTH: "true"
      #PAM_AUTH_URL: "http://host.docker.internal:9090"
      PAM_AUTH_URL: "http://10.131.65.136:9090"


      # Remote Codegen limits
      CODEGEN_MAX_SESSIONS: ${CODEGEN_MAX_SESSIONS:-3}
      CODEGEN_SESSION_TIMEOUT_MS: ${CODEGEN_SESSION_TIMEOUT_MS:-600000}
      CODEGEN_VNC_PORT_START: ${CODEGEN_VNC_PORT_START:-6080}

    volumes:
      - /opt/qa-app/corppt/corppt_bundle.pem:/usr/local/share/ca-certificates/corppt_bundle.crt:ro

    ports:
      - "3000:3000"
      # Faixa de portas VNC usadas pelo noVNC
      - "6080-6089:6080-6089"

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
